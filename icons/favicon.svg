<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="argonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="30%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="argonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with Argon squircle styling -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#argonBg)" stroke="#38bdf8" stroke-width="5" stroke-opacity="0.3" />

  <!-- Subtle Argon decorative rings in background -->
  <circle cx="430" cy="80" r="160" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08" />
  <circle cx="80" cy="450" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.12" />

  <!-- Top Medical Cross in Glowing Circle -->
  <g transform="translate(256, 128)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3.5" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
    <!-- Cross -->
    <rect x="-10" y="-26" width="20" height="52" rx="5" fill="#38bdf8" />
    <rect x="-26" y="-10" width="52" height="20" rx="5" fill="#38bdf8" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Pulse EKG wave -->
  <path d="M 70 230 L 170 230 L 200 205 L 230 255 L 256 195 L 282 255 L 312 205 L 342 230 L 442 230" 
        fill="none" stroke="url(#cyanLine)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Big Bold Crisp "BRH" -->
  <text x="256" y="348" 
        text-anchor="middle" 
        font-family="'Kanit', 'Roboto', 'Arial Black', sans-serif" 
        font-size="132" 
        font-weight="900" 
        letter-spacing="6"
        fill="url(#textGrad)" 
        filter="url(#shadow)">BRH</text>

  <!-- Modern Argon Pill Tag -->
  <g transform="translate(256, 412)" filter="url(#shadow)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#0f172a" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="6" 
          text-anchor="middle" 
          font-family="'Kanit', 'Roboto', sans-serif" 
          font-size="17" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#38bdf8">OPD DASHBOARD</text>
  </g>
</svg>